<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/signature.svg" />
    <title>Marco &amp; Alessandra</title>
    <!-- Preloaded so the two faces that paint immediately -- the script
         wordmark and the body sans -- are in cache before first paint.
         crossorigin is required even same-origin: font fetches are always
         CORS-mode, and without it the preload is discarded and refetched.
         The rest of the faces are declared in src/styles/fonts.css. -->
    <link
      rel="preload"
      href="/fonts/imperial-script-400-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/montserrat-var-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
